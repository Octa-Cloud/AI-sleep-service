syntax = "proto3";

package app.common.kafka.dto;

message BrainwaveInputRaw {
  string trace_id = 1;
  int64 session_no = 2;
  int32 epoch_seconds = 3;

  oneof storage {
    bytes inline_bytes = 10;  // EDF file bytes when sent inline
    string object_uri = 11;   // Optional external storage reference
  }
}

message BrainwaveSplitEpoch {
  string trace_id = 1;
  int64 session_no = 2;
  int32 epoch_index = 3;
  int32 epoch_end_index = 4;
  int64 recorded_at_ms = 5;    // unix epoch millis
  float sampling_rate_hz = 6;
  int32 num_channels = 7;
  int32 sample_count = 8;      // samples per channel in this epoch
  bytes payload = 9;           // float32 little-endian bytes, shape: [num_channels, sample_count]
}

message BrainwaveAnalyzedEpoch {
  string trace_id = 1;
  int64 session_no = 2;
  int32 epoch_index = 3;
  int32 epoch_end_index = 4;
  int32 level = 5;             // predicted sleep level
  int64 recorded_at_ms = 6;    // unix epoch millis
}

message BrainwavePersistRequest {
  message LevelItem {
    int32 epoch_index = 1;
    int32 level = 2;
    int64 recorded_at_ms = 3;
  }
  string trace_id = 1;
  int64 session_no = 2;
  repeated LevelItem levels = 3;
}


